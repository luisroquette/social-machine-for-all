<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Social Machine content operations workflow</title>
  <desc id="description">A visual workflow from signal discovery to measurable published content.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="50" x2="1500" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08121F"/>
      <stop offset="0.54" stop-color="#0D2031"/>
      <stop offset="1" stop-color="#101022"/>
    </linearGradient>
    <linearGradient id="line" x1="188" y1="0" x2="1410" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44E5B2"/><stop offset="0.48" stop-color="#6CB8FF"/><stop offset="1" stop-color="#A88BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1420" cy="110" r="230" fill="#5E4DCC" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="160" cy="800" r="250" fill="#00A77B" fill-opacity=".12" filter="url(#glow)"/>
  <g opacity=".16" stroke="#A7C8DF"><path d="M0 146H1600M0 278H1600M0 410H1600M0 542H1600M0 674H1600M0 806H1600"/><path d="M138 0V900M401 0V900M664 0V900M927 0V900M1190 0V900M1453 0V900"/></g>
  <text x="104" y="133" fill="#79F3C8" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">SOCIAL MACHINE FOR ALL</text>
  <text x="100" y="216" fill="white" font-family="Arial, sans-serif" font-size="66" font-weight="700">Your content workflow,</text>
  <text x="100" y="288" fill="white" font-family="Arial, sans-serif" font-size="66" font-weight="700">working as one system.</text>
  <text x="104" y="342" fill="#B7CBDB" font-family="Arial, sans-serif" font-size="28">Discover signals. Shape drafts. Approve with confidence. Learn from performance.</text>
  <path d="M208 510H1390" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
