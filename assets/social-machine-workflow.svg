  <text x="140" y="735" fill="#79F3C8" font-family="Arial, sans-serif" font-size="22" font-weight="700">YOU DECIDE WHAT RUNS</text>
  <text x="140" y="772" fill="#D6E8F4" font-family="Arial, sans-serif" font-size="25">Self-hosted data • approval-first by default • optional AI and publishing integrations</text>
