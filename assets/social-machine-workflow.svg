      <circle cx="42" cy="42" r="20" fill="#FFB46B" fill-opacity=".16"/><path d="M32 42h20M42 32v20" stroke="#FFD09D" stroke-width="3" stroke-linecap="round"/>
      <text x="28" y="97" fill="white" font-size="27" font-weight="700">Review</text><text x="28" y="130" fill="#9FBDD0" font-size="19">Quality gates and</text><text x="28" y="154" fill="#9FBDD0" font-size="19">human approval</text>
    </g>
