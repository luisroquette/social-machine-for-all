      <text x="28" y="97" fill="white" font-size="27" font-weight="700">Discover</text><text x="28" y="130" fill="#9FBDD0" font-size="19">Trends &amp; sources</text><text x="28" y="154" fill="#9FBDD0" font-size="19">enter one workspace</text>
    </g>
    <g transform="translate(364 424)">
