      <text x="28" y="97" fill="white" font-size="27" font-weight="700">Curate</text><text x="28" y="130" fill="#9FBDD0" font-size="19">Rank relevance.</text><text x="28" y="154" fill="#9FBDD0" font-size="19">Remove duplicates.</text>
    </g>
    <g transform="translate(626 424)">
      <rect width="220" height="176" rx="20" fill="#102638" stroke="#2B5063" stroke-width="2"/>
