      <text x="28" y="97" fill="white" font-size="27" font-weight="700">Create</text><text x="28" y="130" fill="#9FBDD0" font-size="19">Drafts shaped by</text><text x="28" y="154" fill="#9FBDD0" font-size="19">your editorial rules</text>
    </g>
