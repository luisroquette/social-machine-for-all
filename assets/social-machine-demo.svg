<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Animated Social Machine workflow preview</title>
  <desc id="description">An animated visual showing content moving from discovery through review to publication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131E"/><stop offset="1" stop-color="#111126"/>
    </linearGradient>
    <linearGradient id="accent" x1="380" y1="0" x2="1380" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#48E6B4"/><stop offset=".55" stop-color="#69B7FF"/><stop offset="1" stop-color="#B095FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect x="55" y="48" width="1490" height="804" rx="26" fill="#0B1926" stroke="#294354" stroke-width="2"/>
  <rect x="55" y="48" width="255" height="804" rx="26" fill="#09141F"/>
  <circle cx="98" cy="95" r="10" fill="#48E6B4"/><text x="123" y="105" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700">SOCIAL MACHINE</text>
  <g font-family="Arial, sans-serif" font-size="22">
    <text x="92" y="190" fill="#A9C0D0">Overview</text>
    <text x="92" y="252" fill="#A9C0D0">Pipeline</text>
    <text x="92" y="314" fill="#A9C0D0">Drafts</text>
    <text x="92" y="376" fill="#A9C0D0">Evaluations</text>
    <text x="92" y="438" fill="#A9C0D0">Settings</text>
  </g>
  <rect x="77" y="213" width="211" height="58" rx="12" fill="#163044" fill-opacity=".55">
    <animate attributeName="y" values="151;213;275;337;213" keyTimes="0;.22;.45;.68;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="410" y="117" fill="white" font-family="Arial, sans-serif" font-size="35" font-weight="700">Content operations overview</text>
  <text x="410" y="154" fill="#8EAABA" font-family="Arial, sans-serif" font-size="20">One workspace · clear stages · controlled publishing</text>
  <g font-family="Arial, sans-serif">
    <rect x="370" y="212" width="210" height="105" rx="17" fill="#112637" stroke="#2E5062"/>
    <text x="394" y="250" fill="#8EAABA" font-size="18">DISCOVERED</text><text x="394" y="292" fill="white" font-size="33" font-weight="700">24</text>
    <rect x="602" y="212" width="210" height="105" rx="17" fill="#112637" stroke="#2E5062"/>
    <text x="626" y="250" fill="#8EAABA" font-size="18">CURATED</text><text x="626" y="292" fill="white" font-size="33" font-weight="700">8</text>
    <rect x="834" y="212" width="210" height="105" rx="17" fill="#112637" stroke="#2E5062"/>
    <text x="858" y="250" fill="#8EAABA" font-size="18">IN REVIEW</text><text x="858" y="292" fill="white" font-size="33" font-weight="700">3</text>
    <rect x="1066" y="212" width="210" height="105" rx="17" fill="#112637" stroke="#2E5062"/>
    <text x="1090" y="250" fill="#8EAABA" font-size="18">APPROVED</text><text x="1090" y="292" fill="white" font-size="33" font-weight="700">2</text>
    <rect x="1298" y="212" width="190" height="105" rx="17" fill="#112637" stroke="#2E5062"/>
    <text x="1322" y="250" fill="#8EAABA" font-size="18">PUBLISHED</text><text x="1322" y="292" fill="white" font-size="33" font-weight="700">1</text>
  </g>
  <path d="M430 403H1415" stroke="#29495B" stroke-width="8" stroke-linecap="round"/>
  <path d="M430 403H1415" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="170 815">
    <animate attributeName="stroke-dashoffset" values="170;-815" dur="12s" repeatCount="indefinite"/>
  </path>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="430" cy="403" r="18" fill="#48E6B4"/><text x="430" y="451" fill="#C2D5E1" font-size="19">Signal</text>
    <circle cx="675" cy="403" r="18" fill="#58D6D6"/><text x="675" y="451" fill="#C2D5E1" font-size="19">Curated</text>
    <circle cx="920" cy="403" r="18" fill="#69B7FF"/><text x="920" y="451" fill="#C2D5E1" font-size="19">Draft</text>
    <circle cx="1165" cy="403" r="18" fill="#8DA3FF"/><text x="1165" y="451" fill="#C2D5E1" font-size="19">Approved</text>
    <circle cx="1415" cy="403" r="18" fill="#B095FF"/><text x="1415" y="451" fill="#C2D5E1" font-size="19">Published</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="370" y="515" width="1118" height="241" rx="20" fill="#0E2130" stroke="#29495B"/>
    <text x="404" y="560" fill="#7FEAC8" font-size="18" font-weight="700">ACTIVE ITEM</text>
    <text x="404" y="605" fill="white" font-size="28" font-weight="700">A relevant source becomes a reviewable, channel-ready draft</text>
    <rect x="404" y="640" width="230" height="52" rx="11" fill="#183447"/><text x="430" y="673" fill="#B7CEDC" font-size="18">Source retained</text>
    <rect x="653" y="640" width="230" height="52" rx="11" fill="#183447"/><text x="679" y="673" fill="#B7CEDC" font-size="18">Duplicates checked</text>
    <rect x="902" y="640" width="230" height="52" rx="11" fill="#183447"/><text x="928" y="673" fill="#B7CEDC" font-size="18">Quality scored</text>
    <rect x="1151" y="640" width="290" height="52" rx="11" fill="#183447"/><text x="1177" y="673" fill="#B7CEDC" font-size="18">Human decision recorded</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <text x="370" y="812" fill="#48E6B4" opacity="0">DISCOVERING SIGNALS<animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;.18;.22;.99;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="370" y="812" fill="#69B7FF" opacity="0">CREATING A REVIEWABLE DRAFT<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.28;.48;.52;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="370" y="812" fill="#8DA3FF" opacity="0">WAITING FOR APPROVAL<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.54;.7;.74;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="370" y="812" fill="#B095FF" opacity="0">PUBLISHED · LEARNING FROM PERFORMANCE<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.74;.78;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
</svg>
